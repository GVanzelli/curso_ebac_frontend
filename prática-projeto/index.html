<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prática projeto 12</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <!-- Esse #conteudo-pagina é só para simular simplisticamente um site aleatório -->
        <div class="row" id="#conteudo-pagina">
            <h1>Site teste</h1>
            <div class="col-4">
                <img src="https://placehold.co/180x180" alt="imagem teste">
            </div>
            <div class="col-8">

            </div>

        <!-- Formulário para a atividade proposta -->
        <hr>
        <div id="#form-contato">
            <div class="row">
                <div class="col">
                    <h3>Entre em contato conosco</h3>
                    <form>
                        <label class="form-label" for="Nome">Nome:</label>
                        <input class="form-control" type="text">
                        <label class="form-label" for="email">E-mail:</label>
                        <input class="form-control" type="email">
                        <label class="form-label" for="telefone">Telefone</label>
